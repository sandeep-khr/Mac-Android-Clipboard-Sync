name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Mac — Swift tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path mac/ClipSyncCore

  android:
    name: Android — build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android/ClipSyncAndroid
        run: ./gradlew assembleDebug --no-daemon
