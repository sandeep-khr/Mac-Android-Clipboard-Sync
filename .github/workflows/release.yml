name: Release

# Tag a commit to cut a release, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Android APK + the Mac .app and attaches them to a GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android/ClipSyncAndroid
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename artifact
        run: cp android/ClipSyncAndroid/app/build/outputs/apk/debug/app-debug.apk ClipSync-android.apk
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipSync-android.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  mac:
    name: Build Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Assemble + ad-hoc sign ClipSync.app
        run: bash mac/build-app.sh
      - name: Zip the app
        run: ditto -c -k --keepParent mac/build/ClipSync.app ClipSync-mac.zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipSync-mac.zip
          fail_on_unmatched_files: true
